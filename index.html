<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Pierre Mysterieuse — Arts Plastiques 5°8</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <div id="hud">
      <span id="level-label">Niveau 1</span>
      <span id="fragments">Fragments : 0/4</span>
      <span id="timer">Temps : 0:00</span>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="message" class="hidden"></div>
  </div>
  <div id="start-screen" class="overlay">
    <div class="panel">
      <h1>La Pierre Mysterieuse</h1>
      <p class="subtitle">Projet Arts Plastiques — Classe 5°8</p>
      <p>Explore 3 mondes, collecte 4 fragments par niveau. Fleches/WASD + Espace.</p>
      <button id="btn-start" class="btn primary">Commencer l'aventure</button>
      <button id="btn-results" class="btn secondary">Voir les resultats (classe 5°8)</button>
    </div>
  </div>
  <div id="lore-screen" class="overlay hidden">
    <div class="panel lore">
      <h2 id="lore-title">Fragment</h2>
      <p id="lore-text"></p>
      <button id="btn-continue" class="btn primary">Continuer</button>
    </div>
  </div>
  <div id="win-screen" class="overlay hidden">
    <div class="panel">
      <h2>La Pierre est reunie !</h2>
      <p id="win-stats"></p>
      <form id="score-form">
        <input type="text" id="prenom" placeholder="Prenom" required />
        <input type="text" id="nom" placeholder="Nom" required />
        <input type="text" id="classe" placeholder="Classe (5°8)" required />
        <button type="submit" class="btn primary">Enregistrer</button>
      </form>
      <p id="form-feedback" class="feedback"></p>
      <button id="btn-replay" class="btn secondary">Rejouer</button>
    </div>
  </div>
  <div id="results-screen" class="overlay hidden">
    <div class="panel wide">
      <h2>Resultats 5°8</h2>
      <div id="auth-box">
        <input type="text" id="auth-classe" placeholder="5°8" />
        <button id="btn-auth" class="btn primary">Valider</button>
        <p id="auth-error" class="feedback error"></p>
      </div>
      <div id="results-list" class="hidden">
        <table><thead><tr><th>#</th><th>Prenom</th><th>Nom</th><th>Temps</th><th>Frag.</th></tr></thead>
        <tbody id="results-body"></tbody></table>
        <button id="btn-clear" class="btn danger">Effacer</button>
      </div>
      <button id="btn-back" class="btn secondary">Retour</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
